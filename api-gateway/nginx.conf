events {
    worker_connections 1024;
}

http {
    upstream usuarios_backend {
        server usuarios-service:8001;
    }

    upstream pedidos_backend {
        server pedidos-service:8002;
    }

    server {
        listen 80;
        server_name localhost;

        # Página principal del API Gateway
        location = / {
            default_type application/json;
            return 200 '{"mensaje":"API Gateway funcionando correctamente"}';
        }

        # Microservicio de usuarios
        location /usuarios {
            proxy_pass http://usuarios_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Microservicio de pedidos
        location /pedidos {
            proxy_pass http://pedidos_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}